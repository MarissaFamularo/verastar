<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>One-month survey · Verastar</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <main>
      <p class="brand">VERASTAR · BETA</p>
      <h1 id="survey-title">How’s it going?</h1>
      <p id="survey-status" role="status">Loading the survey…</p>
      <form id="survey-form" hidden></form>
      <noscript><p>Enable JavaScript to answer the survey here, or open Verastar and answer it on your digest page.</p></noscript>
      <a id="survey-open" class="button" href="./" hidden>Open Verastar</a>
    </main>
    <script type="module" src="/src/emailSurvey.js"></script>
  </body>
</html>
